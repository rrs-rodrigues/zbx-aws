version: '3.5'

networks:
  network-zabbix:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
      - subnet: 172.20.0.0/16

services:
  zabbix-server:
    container_name: zabbix-server
    image: zabbix/zabbix-server-pgsql:alpine-6.0-latest
    networks:
      - network-zabbix
    restart: always
    ports:
      - '10051:10051'
    volumes:
      - './zabbix/alertscripts:/usr/lib/zabbix/alertscripts'
    volumes_from:
      - zabbix-traps
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd

  zabbix-frontend:
    container_name: zabbix-frontend
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.0-latest
    networks:
      - network-zabbix
    restart: always
    ports:
      - '8080'
      - '443:8443'
    volumes:
      - /etc/ssl/nginx:/etc/ssl/nginx:ro	  
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - PHP_TZ=America/Sao_Paulo
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051

  zabbix-traps:
    container_name: zabbix-traps
    image: zabbix/zabbix-snmptraps:alpine-6.0-latest
    networks:
      - network-zabbix
    restart: always
    ports:
      - '162:1162'
    volumes:
      - /var/lib/zabbix/mibs:/usr/share/snmp/mibs:ro
      - /zbx_instance/snmptraps:/var/lib/zabbix/snmptraps:rw
  
  zabbix-proxy:
    container_name: proxy-master
    image: zabbix/zabbix-proxy-sqlite3:alpine-6.0-latest
    networks:
      - network-zabbix
    restart: always
    environment:
      - ZBX_HOSTNAME=proxy-master
      - ZBX_SERVER_HOST=zabbix-server

  zabbix-agent:
    container_name: zabbix-agent
    image: zabbix/zabbix-agent:alpine-6.0-latest
    user: root
    networks:
      - network-zabbix
    links:
      - zabbix-server
    restart: always
    privileged: true
    volumes:
      - /var/run:/var/run
    ports:
      - '10050:10050'
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=zabbix-server

  zabbix-db:
    container_name: zabbix-db
    image: postgres:alpine
    networks:
      - network-zabbix
    restart: always
    environment:
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
    volumes:
      - ./zabbix/db:/var/lib/postgresql/data

  proxy-reverse-npm:
    container_name: proxy-reverse-npm
    image: jc21/nginx-proxy-manager:latest
    networks:
      - network-zabbix
    restart: always
    ports:
      - '81:81'
      - '443:443'
      - '80:80'
    volumes:
      - ./zabbix/npm/data:/data
      - ./zabbix/npm/letsencrypt:/etc/letsencrypt